<div class="buttons"
  [ngStyle]="{ top: (85 - offset) + 'px' }">

  @if (mostrarCrear) {
    <button type="button"
      class="tool-btn"
      (click)="emitNew()"
      [disabled]="desabilitarCrear"
      aria-label="Crear">
      <span class="material-icons">note_add</span>
    </button>
  }

  @if (mostrarGuardar) {
    <button type="button"
      class="tool-btn"
      (click)="emitSave()"
      [disabled]="desabilitarGuardar"
      aria-label="Guardar">
      <span class="material-icons">save</span>
    </button>
  }

  @if (mostrarBorrar) {
    <button type="button"
      class="tool-btn"
      (click)="emitDelete()"
      [disabled]="desabilitarBorrar"
      aria-label="Borrar">
      <span class="material-icons">delete</span>
    </button>
  }

  @if (mostrarBuscar) {
    <button type="button"
      class="tool-btn"
      (click)="emitSearch()"
      [disabled]="desabilitarBuscar"
      aria-label="Buscar">
      <span class="material-icons">search</span>
    </button>
  }

  @if (mostrarImprimir) {
    <button type="button"
      class="tool-btn"
      (click)="emitPrint()"
      [disabled]="desabilitarImprimir"
      aria-label="Imprimir">
      <span class="material-icons">print</span>
    </button>
  }

  @if (mostrarSalir) {
    <button type="button"
      class="tool-btn"
      (click)="emitExit()"
      [disabled]="desabilitarSalir"
      aria-label="Salir">
      <span class="material-icons">power_settings_new</span>
    </button>
  }

</div>
