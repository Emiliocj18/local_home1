<div class="buttons mainColorText"
  [ngStyle]="{top: (85 - offset) + 'px'}">

  @if (mostrarCrear) {
    <button mat-button type="button"
      class="btn btn-default"
      (click)="emitNew()"
      [disabled]="desabilitarCrear">
      <i class="material-icons">note_add</i>
    </button>
  }

  @if (mostrarGuardar) {
    <button mat-button type="button"
      class="btn btn-default"
      (click)="emitSave()"
      [disabled]="desabilitarGuardar">
      <i class="material-icons">save</i>
    </button>
  }

  @if (mostrarBorrar) {
    <button mat-button type="button"
      class="btn btn-default"
      (click)="emitDelete()"
      [disabled]="desabilitarBorrar">
      <i class="material-icons">delete</i>
    </button>
  }

  @if (mostrarBuscar) {
    <button mat-button type="button"
      class="btn btn-default"
      (click)="emitSearch()"
      [disabled]="desabilitarBuscar">
      <i class="material-icons">search</i>
    </button>
  }

  @if (mostrarImprimir) {
    <button mat-button type="button"
      class="btn btn-default"
      (click)="emitPrint()"
      [disabled]="desabilitarImprimir">
      <i class="material-icons">print</i>
    </button>
  }

  @if (mostrarSalir) {
    <button mat-button type="button"
      class="btn btn-default"
      (click)="emitExit()"
      [disabled]="desabilitarSalir">
      <i class="material-icons">power_settings_new</i>
    </button>
  }

</div>
