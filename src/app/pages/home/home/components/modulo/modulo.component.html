<div class="surface-card group flex h-full flex-col items-center justify-between p-5 text-center transition"
  [ngClass]="mantenimiento
    ? 'cursor-default opacity-60'
    : 'cursor-pointer hover:border-brand-500 hover:shadow-card focus-within:ring-2 focus-within:ring-brand-500'"
  (click)="abrirModulo()"
  (keydown.enter)="abrirModulo()"
  (keydown.space)="abrirModulo(); $event.preventDefault()"
  role="button"
  tabindex="0"
  [attr.aria-label]="nombre">
  <span class="grid h-16 w-16 place-items-center rounded-2xl"
    [ngClass]="mantenimiento ? 'bg-slate-100 text-slate-400' : 'bg-brand-50 text-brand-700'">
    <span class="material-icons text-[40px]">{{ icono }}</span>
  </span>
  <h6 class="mt-4 text-sm font-semibold"
    [ngClass]="mantenimiento ? 'text-slate-400' : 'text-slate-700'">{{ nombre }}</h6>
  @if (mantenimiento) {
    <span data-testid="badge-mantenimiento"
      class="mt-3 rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
      Mantenimiento
    </span>
  }
</div>
