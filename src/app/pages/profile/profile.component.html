<div class="pageContentSmall">

  <div class="content">

    <div>
      <mat-card appearance="outlined">

        <div class="cardTitle">
          <h2>Información de Perfil</h2>
        </div>

        @if (loading) {
          <mat-card-content class="flex justify-content-center loading">
            <mat-spinner></mat-spinner>
          </mat-card-content>
        }

        @if (error) {
          <mat-card-content>
            <p class="error">{{ error }}</p>
          </mat-card-content>
        }

        @if (form && user) {
          <mat-card-content>
            <form [formGroup]="form">
              <mat-form-field>
                <input type="text"
                  matInput
                  [readonly]="true"
                  [maxlength]="80"
                  formControlName="nom"
                  placeholder="Nombre">
              </mat-form-field>
              <mat-form-field>
                <input type="text"
                  formControlName="ape"
                  [readonly]="true"
                  [maxlength]="60"
                  matInput
                  placeholder="Apellido">
              </mat-form-field>
              <mat-form-field>
                <input type="text"
                  formControlName="tel"
                  matInput
                  [maxlength]="20"
                  placeholder="Teléfono">
                <mat-error>
                  Campo requerido
                </mat-error>
              </mat-form-field>
              <mat-form-field>
                <input type="text"
                  formControlName="ema"
                  matInput
                  [maxlength]="100"
                  placeholder="Email">
                <mat-error>
                  Campo requerido
                </mat-error>
              </mat-form-field>
              <mat-form-field>
                <input type="text"
                  [matDatepicker]="picker"
                  formControlName="nac"
                  [readonly]="true"
                  matInput
                  placeholder="Fecha Nacimiento">
                <mat-datepicker-toggle matSuffix [for]="picker" [disabled]="true"></mat-datepicker-toggle>
                <mat-datepicker #picker [disabled]="true"></mat-datepicker>
              </mat-form-field>
            </form>
          </mat-card-content>
        }

      </mat-card>
    </div>

  </div>

</div>

@if (form && user) {
  <toolbar
    (guardar)="save()"
    [desabilitarGuardar]="user.identification==null || saving"
    [desabilitarBorrar]="true"
    [desabilitarBuscar]="true"
    [desabilitarCrear]="true"
    [desabilitarImprimir]="true"
  ></toolbar>
}
