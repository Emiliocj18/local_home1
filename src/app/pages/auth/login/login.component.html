<div class="relative min-h-screen overflow-hidden bg-navy-950 text-white">
  <div class="sigesp-grid pointer-events-none absolute inset-0 opacity-60"></div>
  <div class="pointer-events-none absolute -left-40 top-16 h-96 w-96 rounded-full bg-brand-600/30 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-32 bottom-0 h-[30rem] w-[30rem] rounded-full bg-accent-400/20 blur-3xl"></div>

  <main class="relative mx-auto grid min-h-screen w-full max-w-7xl items-center gap-12 px-6 py-10 lg:grid-cols-[1.1fr_0.9fr] lg:px-10">
    <!-- Columna de marca (oculta en móvil) -->
    <section class="hidden lg:block">
      <img src="assets/img/sigesp/logofblanco.png" alt="SIGESP" class="h-12 w-auto" />
      <p class="mt-12 text-xs font-semibold uppercase tracking-[0.32em] text-accent-300">ERP institucional</p>
      <h1 class="mt-4 max-w-xl text-5xl font-extrabold leading-[1.05] tracking-tight">Acceso seguro a los módulos SIGESP.</h1>
      <p class="mt-6 max-w-lg text-base leading-7 text-slate-300">Gestione empresas, usuarios y procesos desde un solo panel.</p>
      <div class="mt-10 grid max-w-lg grid-cols-3 gap-3">
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <p class="text-2xl font-bold text-white">Módulos</p>
          <p class="mt-1 text-xs text-slate-400">Catálogo funcional</p>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <p class="text-2xl font-bold text-white">Empresas</p>
          <p class="mt-1 text-xs text-slate-400">Multiconexión</p>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <p class="text-2xl font-bold text-white">24/7</p>
          <p class="mt-1 text-xs text-slate-400">Acceso seguro</p>
        </div>
      </div>
    </section>

    <!-- Tarjeta de acceso -->
    <section class="mx-auto w-full max-w-md">
      <div class="glass-panel p-7 sm:p-9">
        <img src="assets/img/sigesp/logofblanco.png" alt="SIGESP" class="h-9 w-auto lg:hidden" />
        <h2 class="mt-8 text-2xl font-bold tracking-tight">Iniciar sesión</h2>
        <p class="mt-2 text-sm leading-6 text-slate-300">Seleccione su empresa e ingrese sus credenciales.</p>
        <loginForm></loginForm>
      </div>
    </section>
  </main>
</div>
