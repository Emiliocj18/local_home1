<ng-container *ngIf="loaded; else loading">
  <form class="fond" [formGroup]="loginForm">

    <mat-form-field appearance="outline"> 
      <mat-label>Seleccionar Empresa:</mat-label>
      <mat-icon matSuffix>storage</mat-icon>
      <mat-select matInput formControlName="selectdb" required>
        <mat-option *ngFor="let db of basesDeDatos" [value]="db">{{db.nombre}}
        </mat-option>
      </mat-select>
      <!--<mat-error *ngIf="f_login.controls['selectdb'].hasError('required')">Por favor, Seleccione la Empresa!
      </mat-error>-->
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Usuario:</mat-label>
      <input formControlName="usuario" matInput placeholder="Nombre de Usuario" required>
      <mat-icon matSuffix>person</mat-icon>
      <mat-error *ngIf="loginForm.controls['usuario'].valid &&loginForm.controls['usuario'].touched">
        Debe ingresar nombre de usuario!
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña:</mat-label>
      <input formControlName="clave" matInput placeholder="Contraseña" required [type]="hide ? 'password' : 'text'">
      <mat-icon mat-icon-button matSuffix
      (click)="hide = !hide"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hide">
      {{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
      <mat-error *ngIf="!loginForm.controls['clave'].valid && loginForm.controls['clave'].touched">
        Debe Ingregar la contraseña!
      </mat-error>
    </mat-form-field>

    <p class="error" *ngIf="showError">{{mensaje}}</p>

    <div class="flex justify-content-center">
      <button [disabled]="!loginForm.valid || sending"
      mat-raised-button color="primary"
      (click)="login()">
        <mat-icon>done</mat-icon>Ingresar
      </button>
    </div>

    <a [routerLink]="['/auth/sign-up']" routerLinkActive="router-link-active"
    class="mainColorText">
      ¿No tienes una cuenta? Regístra una nueva.
    </a>

  </form>
</ng-container>

<ng-template #loading>
  <div class="flex justify-content-center loading">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
